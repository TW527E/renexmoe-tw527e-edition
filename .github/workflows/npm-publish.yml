name: Node.js Package

on:
  push:
    branches:
      - master

# npm trusted publishing (OIDC): GitHub Actions proves to npm which repository
# and workflow is publishing, so no npm token is stored anywhere. Configure it
# once on npmjs.com → package Settings → Trusted Publisher (GitHub Actions,
# TW527E / renexmoe-tw527e-edition / npm-publish.yml).
permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      # npm refuses to publish a version twice, so a push without a version
      # bump used to fail this job. Publish only when package.json changed it.
      - name: Check whether this version is already on npm
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        run: npm publish
